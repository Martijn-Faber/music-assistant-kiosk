name: app
description: Living room Music Assistant kiosk client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.8.1
  flutter_secure_storage: ^11.2.0
  music_assistant: ^0.2.0
  flutter_svg: ^2.0.17
  qr_flutter: ^4.1.0
  music_assistant_api:
    path: packages/music_assistant_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
